<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="Portfolio of Ritesh Dhungel – Showcasing GitHub projects, development work, and blogs." />
  <title>Ritesh Dhungel | GitHub Projects</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
  <div id="header-placeholder"></div>

  <section class="bg-dark text-white text-center py-5">
    <div class="container">
      <h1 class="display-4 fw-bold">Welcome to My GitHub Projects</h1>
      <p class="lead">Explore my software work, tools, and learning journey below.</p>
    </div>
  </section>

  <main class="container my-5">
    <section id="projects" class="mb-5">
      <h2 class="text-center fw-semibold mb-4">Featured Projects</h2>
      <div class="row g-4" id="project-cards"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="scripts/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const yearSpan = document.getElementById('current-year');
      if (yearSpan) yearSpan.textContent = new Date().getFullYear();
    });
  </script>
</body>

</html>
